name: CI

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

jobs:
    basic-checks:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v3

            - name: Setup Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: '20'

            - name: Install dependencies
              run: npm ci

            - name: Run linter
              run: npm run lint

            - name: Run tests
              env:
                  NODE_ENV: test
                  RIOT_API_KEY: dummy
                  DISCORD_TOKEN: dummy
                  MONGO_DB_NAME: dummy
                  MONGO_URI: mongodb://localhost:27017
                  SEASON_INFO: '{"year":2024,"season":1,"split":2,"preseason":false}'
              run: npm run test -- --verbose
